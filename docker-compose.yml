services:
  api:
    build: ./backend
    container_name: argos-api
    environment:
      APP_ROOT: /app
      SOURCES_CONFIG: /app/config/sources.yml
      DATABASE_PATH: /app/data/monitoring.db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    restart: unless-stopped
    mem_limit: 350m

  web:
    build: ./web
    container_name: argos
    ports:
      - "1207:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    mem_limit: 150m
