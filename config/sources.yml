app:
  name: "Argos"
  description: "Catalogue RSS pour IA générative, agents, RAG, deep learning, MLOps et HPC"
storage:
  retention_days: 180  # Purge automatique après chaque collecte

categories:
  - name: "Recherche fondamentale & publications"
    color: "#6d5dfc"
    keywords: ["foundation model", "language model", "multimodal", "diffusion", "reasoning", "deep learning", "transformer"]
    sources:
      - name: "arXiv — Artificial Intelligence"
        url: "http://export.arxiv.org/rss/cs.AI"
      - name: "arXiv — Machine Learning"
        url: "http://export.arxiv.org/rss/cs.LG"
      - name: "arXiv — Computation and Language"
        url: "http://export.arxiv.org/rss/cs.CL"
      - name: "arXiv — Computer Vision"
        url: "http://export.arxiv.org/rss/cs.CV"
      - name: "arXiv — Robotics"
        url: "http://export.arxiv.org/rss/cs.RO"
      - name: "arXiv — Statistics / Machine Learning"
        url: "http://export.arxiv.org/rss/stat.ML"
      - name: "Papers with Code — Latest"
        url: "https://paperswithcode.com/feeds/latest"
      - name: "The Gradient"
        url: "https://thegradient.pub/rss/"
      - name: "MIT News — Machine Learning"
        url: "https://news.mit.edu/rss/topic/machine-learning"
      - name: "Stanford HAI News"
        url: "https://hai.stanford.edu/news/rss.xml"

  - name: "Laboratoires, modèles & fournisseurs"
    color: "#2563eb"
    keywords: ["LLM", "model release", "open weight", "inference", "fine-tuning", "benchmark", "safety"]
