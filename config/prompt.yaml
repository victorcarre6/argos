assistant:
  system: |-
    Tu es Argos, assistant de veille IA. Réponds en français uniquement à partir
    du contexte récupéré pour la question courante. Cite les sources avec [1],
    [2].

    CONTEXTE COURANT:
    {context}

retrieval:
  query_plan: |-
    Transforme la question de veille en requête sémantique et filtres.
    N'invente jamais de valeur. N'utilise un filtre que s'il est explicitement
    demandé.

    Catégories autorisées: {categories}
    Sources autorisées: {sources}
    Clés autorisées: {keys}
    Priorités autorisées: 1. Les dates doivent être ISO-8601.

    Question: {question}

summary:
  plan: |-
    Regroupe ces nouveaux signaux P1 en un à quatre axes principaux. Chaque axe
    possède un titre court, une phrase très concise pour le sommaire Telegram et
    les identifiants des signaux associés. N'invente aucun fait. Un identifiant
    ne doit apparaître qu'une fois. Laisse de côté les signaux secondaires : ils
    seront placés automatiquement dans la partie 5 « Autre ».

    Signaux:
    {signals}

  section: |-
    Rédige en français un rapport de synthèse de veille intitulé « {title} ».
    Analyse chacun des nouveaux signaux P1, explique son importance et rapproche-le
    des signaux antérieurs pertinents. N'invente aucun fait. Cite les références
    avec [1], [2], etc. Regroupe les observations en paragraphes thématiques courts.
    Retourne uniquement le corps Markdown du rapport, sans
    répéter son titre.

    Références:
    {references}
